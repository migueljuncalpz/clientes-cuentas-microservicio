spring:
  datasource:
    url: jdbc:h2:mem:cuentas-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
app:
  security:
    jwt:
      issuer-uri: cuentas-test
      audience: cuentas-api-test
      public-key-location: classpath:security/test-public-key.pem
management:
  tracing:
    sampling:
      probability: 0.0
logging:
  level:
    root: WARN
    com.zarahome.cuentas.infrastructure.observability: INFO
