spring:
  application:
    name: clientes-cuentas-microservicio
  datasource:
    url: jdbc:h2:mem:cuentas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false

server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

app:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:}
      jwk-set-uri: ${JWT_JWKS_URI:}
      public-key-location: ${LOCAL_JWT_PUBLIC_KEY:}
      audience: ${JWT_AUDIENCE:}
      jws-algorithm: ${JWT_JWS_ALGORITHM:RS256}
