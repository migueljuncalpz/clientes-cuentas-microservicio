services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "local"
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
      APP_SECURITY_ENABLED: "true"
      JWT_ISSUER_URI: "cuentas-local"
      JWT_AUDIENCE: "cuentas-api-local"
      LOCAL_JWT_KEY_DIR: "/app/var/jwt"
      LOCAL_JWT_PUBLIC_KEY: "file:/app/var/jwt/public.pem"
      LOCAL_JWT_SCOPES: "cuentas.read cuentas.write actuator.health.read actuator.metrics.read"
